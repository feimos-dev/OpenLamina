# Builds OpenLamina for Windows and Linux, 64- and 32-bit, the Windows installer, and packs the archives (scripts/ci;
# the same scripts build locally). A v* tag (v2026.11.07, say) also puts them on its release: a pushed tag gets a new draft release, to check
# and publish by hand; a tag made by publishing a release on GitHub's release page gets the files added to that release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The vcpkg release the Windows builds take the Vulkan headers and loader from.
  VCPKG_REF: '2026.10.16'

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            dll: vrclient_x64.dll
            tests: true
          - arch: x86
            dll: vrclient.dll
            tests: true
            # The answers that differ from 64-bit (pointer-sized ones), over stand-in.json
            baseline: --baseline tests/conformance/baseline/stand-in-x86.json
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Vulkan headers and loader (vcpkg ${{ env.VCPKG_REF }})
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --quiet --depth 1 --branch $env:VCPKG_REF https://github.com/microsoft/vcpkg.git $vcpkg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $vcpkg 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $vcpkg 'vcpkg.exe') install --vcpkg-root $vcpkg --triplet ${{ matrix.arch }}-windows vulkan-headers vulkan-loader
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: >-
          scripts/ci/build-windows.ps1 -Arch ${{ matrix.arch }}
          -Vulkan (Join-Path $env:RUNNER_TEMP 'vcpkg\installed\${{ matrix.arch }}-windows')
          -Out build -Version "$env:GITHUB_SHA ($env:GITHUB_REF_NAME)"
          ${{ matrix.tests && '-Tests' || '' }}

      # Every OpenVR interface version Valve has shipped is offered or set aside with a reason (offline: it compares
      # interfaces.txt with the source)
      - name: Interface inventory
        if: matrix.tests && matrix.arch == 'x64'
        run: python scripts/openvr_inventory.py --check

      # Nothing may end, crash or hang; every run is checked, and the summaries kept
      - name: Conformance
        if: matrix.tests
        shell: pwsh
        # The matrix's values come in through the environment: a script with an expression in it is limited in length
        env:
          OC_DLL: ${{ matrix.dll }}
          OC_BASELINE: ${{ matrix.baseline }}
        run: |
          $failed = 0
          $baselineArgs = if ($env:OC_BASELINE) { -split $env:OC_BASELINE } else { @() }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime none --ci --out conformance/none
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --out conformance/stand-in --expected tests/conformance/expected/steamvr-1792185270.json --differences tests/conformance/differences.json
          if ($LASTEXITCODE) { $failed++ }
          # The regression run against a recorded baseline: nothing that was ok when it was recorded breaks, and no answer changes
          python tests/conformance/regress.py --results conformance/none/results.json --baseline tests/conformance/baseline/none.json
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/regress.py --results conformance/stand-in/results.json --baseline tests/conformance/baseline/stand-in.json @baselineArgs
          if ($LASTEXITCODE) { $failed++ }
          # What OpenLamina does when OpenXR calls fail (expect/xr_failures.json)
          python tests/conformance/xr_failures.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --ci --out conformance/xr-failures
          if ($LASTEXITCODE) { $failed++ }
          # Exact answers for chosen cases (expect/)
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases submit-edges --expect tests/conformance/expect/submit.json --out conformance/submit-edges
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases old-calls,old-events --script tests/conformance/scripts/legacy_click.json --expect tests/conformance/expect/old_calls.json --out conformance/old-calls
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases old-submit --expect tests/conformance/expect/old_submit.json --out conformance/old-submit
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases old-overlay --script tests/conformance/scripts/keyboard.json --ini tests/conformance/ini/keyboard_us.ini --expect tests/conformance/expect/old_overlay.json --out conformance/old-overlay
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases overlay-transforms --script tests/conformance/scripts/overlay_transforms.json --expect tests/conformance/expect/overlay_transforms.json --out conformance/overlay-transforms
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases old-misc --expect tests/conformance/expect/old_misc.json --out conformance/old-misc
          if ($LASTEXITCODE) { $failed++ }
          # SteamVR's render models, with a fixture of our own as SteamVR's install (run.py sets OC_TEST_STEAMVR_DIR)
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases render-models --ini tests/conformance/ini/steamvr_render_models.ini --expect tests/conformance/expect/render_models.json --out conformance/render-models
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases new-interfaces --expect tests/conformance/expect/new_interfaces.json --out conformance/new-interfaces
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases device-identity --expect tests/conformance/expect/device_identity.json --out conformance/device-identity
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases applications --expect tests/conformance/expect/applications.json --out conformance/applications
          if ($LASTEXITCODE) { $failed++ }
          # The Steam client (a copy named steam.exe) never starts the OpenXR runtime; any other program's headset check starts it
          New-Item -ItemType Directory -Force -Path build/observer | Out-Null
          Copy-Item build/tests/oc_conformance.exe build/observer/steam.exe
          $standIn = (Resolve-Path build/tests/runtime/oc_test_runtime.json).Path
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/observer/steam.exe --xr-runtime $standIn --ci --cases observer --expect tests/conformance/expect/observer_steam.json --out conformance/observer-steam
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime $standIn --ci --cases observer --expect tests/conformance/expect/observer_game.json --out conformance/observer-game
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases chaperone,chaperone-read --jobs 1 --script tests/conformance/scripts/stage_2x3.json --expect tests/conformance/expect/chaperone.json --out conformance/chaperone
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases events --script tests/conformance/scripts/legacy_click.json --expect tests/conformance/expect/events.json --out conformance/events
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases events-listen,events-commit --jobs 2 --expect tests/conformance/expect/events_two_processes.json --out conformance/events-two-processes
          if ($LASTEXITCODE) { $failed++ }
          # Frames and overlays from each graphics API, as the stand-in reads them back (expect/gfx.json). D3D11, D3D12
          # and D3D10 run on WARP; with no Vulkan or OpenGL
          # driver here, those skip
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases overlay-images,gfx-d3d11-basic,gfx-d3d12-basic,gfx-vk-basic,gfx-gl-basic,gfx-d3d10-basic,gfx-d3d11-odd,gfx-d3d11-bounds,gfx-d3d12-bounds,gfx-vk-bounds,gfx-gl-bounds,overlay-raw-d3d11,overlay-raw-d3d12,overlay-raw-vk,overlay-raw-gl,overlay-texture-readback-d3d11,overlay-texture-readback-d3d12,overlay-texture-readback-vk,overlay-texture-readback-gl --script tests/conformance/scripts/gfx_all_apis.json --expect tests/conformance/expect/gfx.json --allow-skip ".*-(vk|gl)(-.*)?" --out conformance/gfx
          if ($LASTEXITCODE) { $failed++ }
          # Formats the runtime doesn't offer (it has RGBA8 sRGB only), converted into the one it has
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases gfx-d3d11-formats,gfx-d3d12-formats,gfx-vk-formats,gfx-gl-formats --script tests/conformance/scripts/gfx_rgba8_only.json --expect tests/conformance/expect/gfx_formats.json --allow-skip ".*-(vk|gl)(-.*)?" --out conformance/gfx-formats
          if ($LASTEXITCODE) { $failed++ }
          # The pose and depth a frame was submitted with: used with useSubmittedPose and submitDepth on, not without
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases gfx-d3d11-pose-depth,gfx-d3d12-pose-depth,gfx-vk-pose-depth,gfx-gl-pose-depth --script tests/conformance/scripts/gfx_depth.json --ini tests/conformance/ini/pose_depth.ini --expect tests/conformance/expect/gfx_pose_depth.json --allow-skip ".*-(vk|gl)(-.*)?" --out conformance/gfx-pose-depth
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases gfx-d3d11-pose-depth,gfx-d3d12-pose-depth,gfx-vk-pose-depth,gfx-gl-pose-depth --script tests/conformance/scripts/gfx_depth.json --expect tests/conformance/expect/gfx_pose_depth_off.json --allow-skip ".*-(vk|gl)(-.*)?" --out conformance/gfx-pose-depth-off
          if ($LASTEXITCODE) { $failed++ }
          # OpenGL and Vulkan frames through D3D11 where the runtime has D3D11 alone (they skip without those drivers)
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases gfx-gl-interop,gfx-vk-interop,gfx-gl-interop-bounds,gfx-vk-interop-bounds --expect tests/conformance/expect/gfx_interop.json --allow-skip "gfx-(vk|gl)-.*" --out conformance/gfx-interop
          if ($LASTEXITCODE) { $failed++ }
          # The events SteamVR sends for session changes: with sessionEvents all of them, without it only the IPD's and the quit
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases session-events --script tests/conformance/scripts/session_events.json --ini tests/conformance/ini/session_events.ini --expect tests/conformance/expect/session_events.json --out conformance/session-events
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases session-events --script tests/conformance/scripts/session_events.json --expect tests/conformance/expect/session_events_off.json --out conformance/session-events-off
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases velocities --script tests/conformance/scripts/velocities.json --expect tests/conformance/expect/velocities.json --out conformance/velocities
          if ($LASTEXITCODE) { $failed++ }
          # The binding evaluator evaluates a toggle_button, and reads a vector3
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases input-frames --script tests/conformance/scripts/input_toggle.json --manifest tests/unit/data/manifest_toggle.json --expect tests/conformance/expect/input_evaluator.json --out conformance/input-steamvr
          if ($LASTEXITCODE) { $failed++ }
          # Bindings on the primary hand follow the dominant hand
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases input-primary-hand --script tests/conformance/scripts/right_trigger_held.json --manifest tests/unit/data/manifest_primary_hand.json --expect tests/conformance/expect/input_primary_hand.json --out conformance/input-primary-hand
          if ($LASTEXITCODE) { $failed++ }
          # A bound source that isn't an input path: GetActionBindingInfo leaves it out
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases binding-info --script tests/conformance/scripts/bound_source_odd.json --manifest tests/unit/data/manifest_toggle.json --expect tests/conformance/expect/binding_info.json --out conformance/binding-info
          if ($LASTEXITCODE) { $failed++ }
          # The compositor's calls with every graphics API offered: the Vulkan extension lists with a null buffer
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --only "IVRCompositor_0(19|2[0-9])" --script tests/conformance/scripts/gfx_all_apis.json --out conformance/compositor-all-apis
          if ($LASTEXITCODE) { $failed++ }
          # Eye-tracked foveation from the eye gaze: with an action manifest and with legacy input, canted views, eyeTracking=off, no extension
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases eye-gaze --script tests/conformance/scripts/eye_gaze.json --manifest tests/unit/data/manifest_basic.json --expect tests/conformance/expect/eye_gaze.json --out conformance/eye-gaze
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases eye-gaze --script tests/conformance/scripts/eye_gaze.json --expect tests/conformance/expect/eye_gaze.json --out conformance/eye-gaze-legacy
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases eye-gaze --script tests/conformance/scripts/eye_gaze_canted.json --manifest tests/unit/data/manifest_basic.json --expect tests/conformance/expect/eye_gaze_canted.json --out conformance/eye-gaze-canted
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases eye-gaze --script tests/conformance/scripts/eye_gaze.json --manifest tests/unit/data/manifest_basic.json --ini tests/conformance/ini/eye_tracking_off.ini --expect tests/conformance/expect/eye_gaze_off.json --out conformance/eye-gaze-off
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases eye-gaze --manifest tests/unit/data/manifest_basic.json --expect tests/conformance/expect/eye_gaze_off.json --out conformance/eye-gaze-noext
          if ($LASTEXITCODE) { $failed++ }
          # IVRInput's eye tracking action: a manifest with a binding file naming it, a gaze without a position, eyeTracking=off
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases eye-tracking --script tests/conformance/scripts/eye_gaze.json --manifest tests/unit/data/manifest_eye_tracking.json --expect tests/conformance/expect/eye_tracking.json --out conformance/eye-tracking
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases eye-tracking --script tests/conformance/scripts/eye_gaze_no_position.json --manifest tests/unit/data/manifest_eye_tracking.json --expect tests/conformance/expect/eye_tracking.json --out conformance/eye-tracking-no-position
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases eye-tracking --script tests/conformance/scripts/eye_gaze.json --manifest tests/unit/data/manifest_eye_tracking.json --ini tests/conformance/ini/eye_tracking_off.ini --expect tests/conformance/expect/eye_tracking_off.json --out conformance/eye-tracking-off
          if ($LASTEXITCODE) { $failed++ }
          # Input from two threads at once
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases input-threads --repeat 5 --script tests/conformance/scripts/input_toggle.json --manifest tests/unit/data/manifest_toggle.json --expect tests/conformance/expect/input_threads.json --out conformance/input-threads-steamvr
          if ($LASTEXITCODE) { $failed++ }
          # The runtime's GPU (the Vulkan record and a second adapter's case skip on a runner without them) and refresh rate
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases gpu-answers,gpu-other-adapter --script tests/conformance/scripts/gfx_all_apis.json --expect tests/conformance/expect/gpu.json --allow-skip "gpu-.*" --out conformance/gpu
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases display-frequency --script tests/conformance/scripts/refresh_72_120.json --expect tests/conformance/expect/display_frequency_fb.json --out conformance/display-frequency-fb
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases display-frequency --script tests/conformance/scripts/display_120.json --expect tests/conformance/expect/display_frequency_measured.json --out conformance/display-frequency-measured
          if ($LASTEXITCODE) { $failed++ }
          # OpenLamina's own frames while the game stalls, also while another thread reads input
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases own-frames,own-frames-race,own-frames-nothing-shown,own-frames-overlay-churn --repeat 5 --jobs 2 --ini tests/conformance/ini/own_frames.ini --expect tests/conformance/expect/own_frames.json --out conformance/own-frames
          if ($LASTEXITCODE) { $failed++ }
          # Overlay and background applications on overlay and headless sessions (a background one only while a game
          # runs), and their refusals without them
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases overlay-app,overlay-app-two-apis --script tests/conformance/scripts/helper_apps.json --expect tests/conformance/expect/helper_apps.json --out conformance/helper-apps
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases background-app,background-app-game --jobs 2 --script tests/conformance/scripts/helper_apps.json --expect tests/conformance/expect/background_app.json --out conformance/background-app
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases background-app-alone --script tests/conformance/scripts/helper_apps.json --expect tests/conformance/expect/background_app_alone.json --out conformance/background-app-alone
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases helper-apps-unsupported --expect tests/conformance/expect/helper_apps_unsupported.json --out conformance/helper-apps-unsupported
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases helper-apps-unsupported --script tests/conformance/scripts/helper_apps_fail_instance.json --expect tests/conformance/expect/helper_apps_unsupported.json --out conformance/helper-apps-runtime-fails
          if ($LASTEXITCODE) { $failed++ }
          # An overlay app's Vulkan and OpenGL textures through D3D11 (they skip without those drivers)
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases overlay-app-vk,overlay-app-gl --script tests/conformance/scripts/helper_apps.json --expect tests/conformance/expect/helper_apps_gl_vk.json --allow-skip "overlay-app-(vk|gl)" --out conformance/helper-apps-gl-vk
          if ($LASTEXITCODE) { $failed++ }
          # An overlay texture read back, written in place and shown on another overlay by its shared handle
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases overlay-app-shared --script tests/conformance/scripts/helper_apps.json --expect tests/conformance/expect/overlay_shared.json --out conformance/overlay-shared
          if ($LASTEXITCODE) { $failed++ }
          # Every interface as an overlay application on its session: nothing crashes, ends or hangs. (A background
          # application gets its session only beside a running game: the background-app cases.)
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --apptypes 2 --script tests/conformance/scripts/helper_apps.json --out conformance/helper-apps-interfaces
          if ($LASTEXITCODE) { $failed++ }
          # The game's pointer on an overlay app's overlay, and an overlay app that ends without shutting down (two programs each)
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases remote-pointer,remote-pointer-overlay --jobs 2 --script tests/conformance/scripts/remote_pointer.json --ini tests/conformance/ini/laser_mouse.ini --expect tests/conformance/expect/remote_pointer.json --out conformance/remote-pointer
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases remote-pointer-peer-dies,remote-pointer-dying-overlay --jobs 2 --script tests/conformance/scripts/remote_pointer.json --ini tests/conformance/ini/laser_mouse.ini --expect tests/conformance/expect/remote_pointer_peer_dies.json --out conformance/remote-pointer-peer-dies
          if ($LASTEXITCODE) { $failed++ }
          # OpenLamina's dashboard over the game, with an overlay app's dashboard overlay (two programs)
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases dashboard,dashboard-overlay --jobs 2 --script tests/conformance/scripts/dashboard.json --ini tests/conformance/ini/dashboard.ini --manifest tests/unit/data/manifest_basic.json --expect tests/conformance/expect/dashboard.json --out conformance/dashboard
          if ($LASTEXITCODE) { $failed++ }
          # A controller's system button held recentres and opens no dashboard; pressed, it opens and closes the dashboard
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases recentre --script tests/conformance/scripts/recentre.json --ini tests/conformance/ini/recentre.ini --expect tests/conformance/expect/recentre.json --out conformance/recentre
          if ($LASTEXITCODE) { $failed++ }
          # A render scale another program sets reaches the game at its next frame (two programs)
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases settings-live,settings-live-setter --jobs 2 --script tests/conformance/scripts/helper_apps.json --expect tests/conformance/expect/settings_live.json --out conformance/settings-live
          if ($LASTEXITCODE) { $failed++ }
          # The play area's walls near its edge with drawBounds, and none without
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases bounds --script tests/conformance/scripts/bounds.json --ini tests/conformance/ini/draw_bounds.ini --expect tests/conformance/expect/bounds.json --out conformance/bounds
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases bounds-room-setup --script tests/conformance/scripts/bounds_room_setup.json --ini tests/conformance/ini/draw_bounds.ini --expect tests/conformance/expect/bounds_room_setup.json --out conformance/bounds-room-setup
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases bounds --script tests/conformance/scripts/bounds.json --expect tests/conformance/expect/bounds_off.json --out conformance/bounds-off
          if ($LASTEXITCODE) { $failed++ }
          # Skyboxes: equirect layers in OpenLamina's own frames, and the old quad where the runtime has none
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases skybox-1,skybox-2,skybox-6 --script tests/conformance/scripts/skybox.json --ini tests/conformance/ini/own_frames.ini --expect tests/conformance/expect/skybox.json --out conformance/skybox
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases skybox-1,skybox-6 --script tests/conformance/scripts/gfx_all_apis.json --expect tests/conformance/expect/skybox_bare.json --out conformance/skybox-bare
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases skybox-1,skybox-6 --script tests/conformance/scripts/skybox.json --expect tests/conformance/expect/skybox_bare.json --out conformance/skybox-off
          if ($LASTEXITCODE) { $failed++ }
          # The controllers' lasers on an overlay as a mouse
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases laser-mouse --script tests/conformance/scripts/laser.json --ini tests/conformance/ini/laser_mouse.ini --expect tests/conformance/expect/laser_mouse.json --out conformance/laser-mouse
          if ($LASTEXITCODE) { $failed++ }
          # The features that are on by default, with the defaults as they ship (every other run starts from
          # ini/features_off.ini): the same answers as their own runs above
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --shipped-defaults --cases laser-mouse --script tests/conformance/scripts/laser.json --expect tests/conformance/expect/laser_mouse.json --out conformance/defaults-laser-mouse
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --shipped-defaults --cases session-events --script tests/conformance/scripts/session_events.json --expect tests/conformance/expect/session_events.json --out conformance/defaults-session-events
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --shipped-defaults --cases gfx-d3d11-pose-depth,gfx-d3d12-pose-depth,gfx-vk-pose-depth,gfx-gl-pose-depth --script tests/conformance/scripts/gfx_depth.json --expect tests/conformance/expect/gfx_pose_depth.json --allow-skip ".*-(vk|gl)(-.*)?" --out conformance/defaults-pose-depth
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --shipped-defaults --cases own-frames,own-frames-race,own-frames-nothing-shown,own-frames-overlay-churn --repeat 2 --jobs 2 --expect tests/conformance/expect/own_frames.json --out conformance/defaults-own-frames
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --shipped-defaults --cases message-overlay --script tests/conformance/scripts/message_box.json --expect tests/conformance/expect/message_overlay.json --out conformance/defaults-message-overlay
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --shipped-defaults --cases bounds --script tests/conformance/scripts/bounds.json --expect tests/conformance/expect/bounds.json --out conformance/defaults-bounds
          if ($LASTEXITCODE) { $failed++ }
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --shipped-defaults --cases recentre --script tests/conformance/scripts/recentre.json --expect tests/conformance/expect/recentre.json --out conformance/defaults-recentre
          if ($LASTEXITCODE) { $failed++ }
          # A message box in OpenLamina's own frames, answered with the laser
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases message-overlay --script tests/conformance/scripts/message_box.json --ini tests/conformance/ini/own_frames.ini --expect tests/conformance/expect/message_overlay.json --out conformance/message-overlay
          if ($LASTEXITCODE) { $failed++ }
          # A message box the session ends under answers as the game's quit
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases message-overlay --script tests/conformance/scripts/message_box_exit.json --ini tests/conformance/ini/own_frames.ini --expect tests/conformance/expect/message_overlay_exit.json --out conformance/message-overlay-exit
          if ($LASTEXITCODE) { $failed++ }
          # The keyboard, typed on with the laser
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases keyboard --script tests/conformance/scripts/keyboard.json --ini tests/conformance/ini/keyboard_us.ini --expect tests/conformance/expect/keyboard.json --out conformance/keyboard
          if ($LASTEXITCODE) { $failed++ }
          # The compositor's statistics, timing and poses per frame
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases compositor-stats,mirror --script tests/conformance/scripts/gfx_all_apis.json --ini tests/conformance/ini/mirror_window.ini --expect tests/conformance/expect/compositor.json --out conformance/compositor-stats
          if ($LASTEXITCODE) { $failed++ }
          # Without mirrorWindow no window is shown; the mirror texture is given all the same
          python tests/conformance/run.py --runtime build/bin/$env:OC_DLL --conformance build/tests/oc_conformance.exe --xr-runtime stand-in --ci --cases mirror --script tests/conformance/scripts/gfx_all_apis.json --expect tests/conformance/expect/mirror_window_off.json --out conformance/mirror-window-off
          if ($LASTEXITCODE) { $failed++ }
          exit $failed

      - uses: actions/upload-artifact@v7
        if: always() && matrix.tests
        with:
          name: conformance-windows-${{ matrix.arch }}
          path: |
            conformance/*/summary.txt
            conformance/*/results.json
            conformance/**/logs/

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: build/bin/${{ matrix.dll }}
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            lib: linux64/vrclient.so
            mesa: ''
          - arch: x86
            lib: vrclient.so
            mesa: ':i386'
    steps:
      # The packages of scripts/ci/ubuntu.dockerfile, and git for the checkout's submodules. For the tests: Mesa's
      # software Vulkan (lavapipe) and OpenGL (llvmpipe) drivers of the build's word size, and Xvfb for OpenGL's X
      # server.
      - name: Build tools
        env:
          MESA: ${{ matrix.mesa }}
        run: |
          dpkg --add-architecture i386
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git g++ g++-multilib cmake make automake autoconf libtool python3 \
            libgl-dev libvulkan-dev libgl-dev:i386 libvulkan-dev:i386 \
            xvfb xauth mesa-vulkan-drivers$MESA libgl1-mesa-dri$MESA libglx-mesa0$MESA

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # No new hard stop (scripts/fatal_sites.txt lists the ones still allowed)
      - name: Hard stops
        if: matrix.arch == 'x64'
        run: |
          python3 scripts/abort_sites.py --self-test
          python3 scripts/abort_sites.py --check

      # The test tools' own checks: the game lister's fixtures, and the regression run's output
      - name: Tool self-tests
        if: matrix.arch == 'x64'
        run: |
          python3 tests/conformance/list_games.py --self-test
          python3 tests/conformance/regress.py --self-test

      # The library, the tests and the unit tests
      - name: Build
        run: sh scripts/ci/build-linux.sh --tests ${{ matrix.arch }} build "$GITHUB_SHA ($GITHUB_REF_NAME)"

      # The stand-in OpenXR runtime's own tests, on lavapipe and llvmpipe
      - name: Stand-in runtime
        run: xvfb-run -a ctest --test-dir build -L runtime --output-on-failure

      # Nothing may end, crash or hang, and no answer may change from the Linux baselines; then the cases with exact
      # answers that apply on Linux (scripts/ci/conformance-linux.sh)
      - name: Conformance
        run: xvfb-run -a sh scripts/ci/conformance-linux.sh ${{ matrix.arch }} build conformance

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-linux-${{ matrix.arch }}
          path: |
            conformance/*/summary.txt
            conformance/*/results.json
            conformance/**/logs/

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: build/bin/${{ matrix.lib }}
          if-no-files-found: error

  # OpenLamina on Monado's simulated headset (built from source, at MONADO_REF), headless: monado-service with the
  # simulated driver and the null compositor, on Mesa's lavapipe
  monado:
    name: Linux x64 on Monado
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 45
    env:
      MONADO_REF: 36a2284cc7b110bd010b2b7f7dc14b8cc2b6aaf1
    steps:
      - name: Build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git g++ cmake make ninja-build automake autoconf libtool python3 pkg-config \
            libgl-dev libvulkan-dev libopengl-dev libglx-dev libegl-dev libx11-xcb-dev libxrandr-dev \
            libxcb-randr0-dev libwayland-dev wayland-protocols libeigen3-dev glslang-tools libbsd-dev \
            libusb-1.0-0-dev libudev-dev xvfb xauth mesa-vulkan-drivers libgl1-mesa-dri libglx-mesa0

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The service and the OpenXR runtime only: no main compositor, no GUI, no SteamVR plugin
      - name: Monado
        run: |
          mkdir monado-src
          cd monado-src
          git init -q
          git remote add origin https://gitlab.freedesktop.org/monado/monado.git
          git fetch -q --depth 1 origin "$MONADO_REF"
          git checkout -q FETCH_HEAD
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/monado" \
            -DXRT_MODULE_COMPOSITOR_MAIN=OFF -DXRT_FEATURE_STEAMVR_PLUGIN=OFF -DXRT_FEATURE_SLAM=OFF -DXRT_HAVE_SDL2=OFF \
            -DXRT_FEATURE_SERVICE_SYSTEMD=OFF -DBUILD_TESTING=OFF -DBUILD_DOC=OFF
          ninja -C build install

      - name: Build
        run: sh scripts/ci/build-linux.sh --tests x64 build "$GITHUB_SHA ($GITHUB_REF_NAME)"

      # Nothing may end, crash or hang on Monado (no baseline: its answers are its own). On lavapipe no session starts:
      # Monado asks for VK_KHR_external_semaphore_fd and VK_KHR_external_fence_fd, which lavapipe lacks, so OpenLamina's
      # own Vulkan device can't be made and every Init answers as without a headset. The notice says how many started.
      - name: Conformance
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          # The service watches its standard input (epoll), which /dev/null can't be: a pipe held open until the end
          mkfifo "$RUNNER_TEMP/monado-stdin"
          XRT_COMPOSITOR_NULL=1 SIMULATED_ENABLE=1 "$RUNNER_TEMP/monado/bin/monado-service" < "$RUNNER_TEMP/monado-stdin" > monado-service.log 2>&1 &
          service=$!
          exec 3> "$RUNNER_TEMP/monado-stdin"
          for _ in $(seq 60); do [ -S "$XDG_RUNTIME_DIR/monado_comp_ipc" ] && break; sleep 0.5; done
          if [ ! -S "$XDG_RUNTIME_DIR/monado_comp_ipc" ]; then echo "::error::monado-service didn't start"; cat monado-service.log; exit 1; fi
          failed=0
          xvfb-run -a python3 tests/conformance/run.py --runtime build/bin/linux64/vrclient.so --conformance build/tests/oc_conformance \
            --xr-runtime "monado:$RUNNER_TEMP/monado/share/openxr/1/openxr_monado.json" --real-runtime --ci --out conformance/monado || failed=1
          kill "$service" || failed=1
          wait "$service" || true
          exec 3>&-
          sessions=$(cat conformance/monado/logs/*.log | grep -c "Started OpenXR session" || true)
          echo "::notice::$sessions OpenXR sessions started on Monado"
          exit $failed

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-monado
          path: |
            conformance/*/summary.txt
            conformance/*/results.json
            conformance/**/logs/
            monado-service.log

  installer:
    name: Windows installer
    needs: windows
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: 'windows-*'

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          # Pinned, and installed over any other version the runner image has.
          choco install innosetup --version=6.7.1 --allow-downgrade --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $iscc /? | Select-Object -First 1
          dotnet --version

      - name: Build
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v', '' } else { "dev-$($env:GITHUB_SHA.Substring(0, 12))" }
          scripts/ci/build-installer.ps1 -Artifacts artifacts -Version $version -Out build/installer -Repository $env:GITHUB_REPOSITORY

      # Packing is byte-reproducible, the installer included (its files carry the commit's time): build it again to check.
      - name: Same bytes again
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v', '' } else { "dev-$($env:GITHUB_SHA.Substring(0, 12))" }
          scripts/ci/build-installer.ps1 -Artifacts artifacts -Version $version -Out build/installer-again -Repository $env:GITHUB_REPOSITORY | Out-Null
          $a = (Get-FileHash build/installer/OpenLamina-Windows-Installer.exe).Hash
          $b = (Get-FileHash build/installer-again/OpenLamina-Windows-Installer.exe).Hash
          if ($a -eq $b) { "::notice::OpenLamina-Windows-Installer.exe is the same bytes when built again ($a)." }
          else { "::error::OpenLamina-Windows-Installer.exe differs when built again ($a, $b)."; exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: build/installer/OpenLamina-Windows-Installer.exe
          if-no-files-found: error

  package:
    name: Archives
    needs: [windows, linux, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: '{windows,linux}-x*'

      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: installer-build

      - name: Pack
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#v}; else version=dev-${GITHUB_SHA:0:12}; fi
          python3 scripts/ci/package.py --version "$version" --artifacts artifacts --out dist --repository "$GITHUB_REPOSITORY" \
            --installer installer-build/OpenLamina-Windows-Installer.exe

      - name: Try install.sh
        run: |
          shellcheck -s sh installer/install.sh scripts/ci/test-install.sh
          sh scripts/ci/test-install.sh dist/OpenLamina-Linux.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: OpenLamina
          path: dist/
          if-no-files-found: error

  release:
    name: Release files
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: OpenLamina
          path: dist

      - name: Put the files on the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -- dist/OpenLamina-Windows-Installer.exe dist/OpenLamina-Windows-Portable.zip dist/OpenLamina-Linux.tar.gz \
            dist/OpenLamina-Source.tar.gz dist/SHA256SUMS.txt
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Made on GitHub's release page: add the files, and keep its title and notes.
            gh release upload "$GITHUB_REF_NAME" "$@" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "OpenLamina ${GITHUB_REF_NAME#v}" --notes-file dist/RELEASE_NOTES.md "$@"
          fi
