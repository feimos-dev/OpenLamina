; What run.py starts every run from, unless it's given --shipped-defaults: the features OpenLamina has on by default
; turned off, so that each case shows one feature at a time (its own --ini turns it on) and the recorded answers of
; the interface matrix stay those of the plain library.
[default]
useSubmittedPose=false
submitDepth=false
ownFrames=false
keyboard=false
laserMouse=false
sessionEvents=false
dashboardButton=off
steamvrRenderModels=false
drawBounds=false
applyZeroPoses=false
